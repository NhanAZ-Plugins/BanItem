name: Build and validate item restrictions

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test item restrictions and legacy data
    runs-on: ubuntu-24.04
    steps:
      - name: Check out plugin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP 8.4
        uses: axolotl-pm/setup-php-action@b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
        with:
          php-version: '8.4'
          pm-version-major: '5'

      - name: Lint source and test API 5 behavior
        shell: bash
        run: |
          set -euo pipefail
          php -l src/Ghast/BanItem/Main.php
          php -l tests/api5-behavior.php
          php tests/api5-behavior.php

  build:
    name: Analyze and build against API ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 5.0.0
            ref: b16cc69974d4e805d21e6328ab77c0e17cd7116d
          - label: 5.51.1
            ref: e881fc1bc1c401545baf6bd1f824e41ff3f57bd1
    uses: AxolotlBucketLabs/DevTools/.github/workflows/build-plugin.yml@latest
    with:
      php-version: '8.4'
      pm-version-major: '5'
      phpstan: max
      axolotl-ref: ${{ matrix.ref }}
      phpstan-paths: src
      artifact-name: banitem-api-${{ matrix.label }}-${{ github.sha }}
  runtime-smoke:
    name: Smoke-test the plugin on Axolotl-PM 5.51.1
    needs: [test, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Set up PHP 8.4 for Axolotl-PM
        uses: axolotl-pm/setup-php-action@b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
        with:
          php-version: '8.4'
          pm-version-major: '5'

      - name: Download the API 5.51.1 PHAR built by this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: banitem-api-5.51.1-${{ github.sha }}
          path: ${{ runner.temp }}/banitem-artifact

      - name: Download and verify the official Axolotl-PM server PHAR
        shell: bash
        env:
          SERVER_SHA256: bcfbd0deff349c2b25b1688299a7d54f1fc8a080d2f95e19884f8e341319021a
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/banitem-runtime"
          curl --fail --location --silent --show-error \
            https://github.com/axolotl-pm/PocketMine-MP/releases/download/5.51.1/PocketMine-MP.phar \
            --output "$RUNNER_TEMP/banitem-runtime/PocketMine-MP.phar"
          printf '%s  %s\n' "$SERVER_SHA256" "$RUNNER_TEMP/banitem-runtime/PocketMine-MP.phar" | sha256sum --check --status

      - name: Verify the plugin starts and reaches server readiness
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/banitem-runtime"
          mkdir -p "$runtime/data/plugins"
          cp "$RUNNER_TEMP/banitem-artifact/BanItem.phar" "$runtime/data/plugins/BanItem.phar"
          php "$runtime/PocketMine-MP.phar" --no-wizard --disable-ansi \
            --data="$runtime/data" --plugins="$runtime/data/plugins" > "$runtime/server.log" 2>&1 &
          server_pid=$!
          ready=0
          for _ in $(seq 1 90); do
            if grep -Fq 'Enabling BanItem v3.0.0' "$runtime/server.log"; then ready=1; fi
            if grep -Fq 'Done (' "$runtime/server.log"; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$runtime/server.log"; exit 1; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ] || ! grep -Fq 'Done (' "$runtime/server.log"; then
            cat "$runtime/server.log"
            kill -INT "$server_pid" 2>/dev/null || true
            wait "$server_pid" || true
            exit 1
          fi
          kill -INT "$server_pid"
          for _ in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$server_pid" 2>/dev/null; then kill "$server_pid"; cat "$runtime/server.log"; exit 1; fi
          wait "$server_pid"
          ! grep -E '\[(ERROR|CRITICAL)\]' "$runtime/server.log"
          cat "$runtime/server.log"
