---
name: BanItem
main: Ghast\BanItem\Main
version: 3.0.0
api: 5.0.0
author: Ghast
description: Restricts selected items by their Axolotl-PM item state
load: POSTWORLD
commands:
  banitem:
    description: Bans or unbans an item, or lists banned items
    permission: banitem.command.banitem
    usage: "/banitem <ban|unban|list> [item name or legacy ID[:meta]]"
permissions:
  banitem:
    default: false
    description: Allows use of banned items
  banitem.bypass:
    default: false
    description: Allows bypassing item bans
  banitem.command.banitem:
    default: op
    description: Allows managing the banned item list